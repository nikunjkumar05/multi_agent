<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAMAS Middleware — Live Dashboard</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a2f; --panel2:#0e1526; --line:#1e2a44;
    --txt:#dbe4ff; --dim:#8a97b8; --accent:#4f8cff; --ok:#2ecc71;
    --warn:#f1c40f; --bad:#ff5c6c; --chip:#1b2540;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:radial-gradient(1200px 600px at 80% -10%,#16224a55,transparent),var(--bg);color:var(--txt);min-height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(6px);z-index:5}
  .logo{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}
  h1{font-size:18px;font-weight:600}h1 span{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}
  .pill{margin-left:auto;font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--line);background:var(--chip)}
  .pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)}
  main{max-width:1200px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:340px 1fr;gap:18px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:12px}
  label{display:block;font-size:11px;color:var(--dim);margin:10px 0 4px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:13px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:64px}
  button{width:100%;margin-top:12px;background:var(--accent);border:none;color:#fff;padding:10px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
  button:hover{filter:brightness(1.15)} button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);margin-top:6px}
  .wallet{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .wallet:hover,.wallet.sel{border-color:var(--accent)}
  .wallet .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
  .wallet b{font-size:13px}
  .bar{height:6px;background:#0a0f1e;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--ok);transition:width .4s}
  .bar i.warn{background:var(--warn)} .bar i.full{background:var(--bad)}
  .tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--dim)}
  .tag.exhausted{color:var(--bad)} .tag.active{color:var(--ok)}
  .agent{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.bad{background:var(--bad)}
  .agent .meta{font-size:11px;color:var(--dim)}
  .task{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--chip);border-radius:10px;padding:12px;margin-bottom:10px}
  .task.completed{border-left-color:var(--ok)} .task.failed{border-left-color:var(--bad)}
  .task.in_progress{border-left-color:var(--accent)} .task.cancelled{border-left-color:var(--dim)}
  .trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .status{font-size:10px;padding:3px 10px;border-radius:12px;font-weight:600;text-transform:uppercase}
  .status.queued{background:#26314f;color:var(--dim)} .status.in_progress{background:#16305c;color:#7fb0ff}
  .status.completed{background:#123b26;color:var(--ok)} .status.failed{background:#421520;color:var(--bad)}
  .status.cancelled{background:#2a2f3d;color:var(--dim)}
  .cost{margin-left:auto;font-family:Consolas,monospace;font-size:12px;color:var(--ok)}
  .prompt-txt{font-size:13px;margin:8px 0 4px;color:var(--txt);word-break:break-word}
  .sub{font-size:11px;color:var(--dim);font-family:Consolas,monospace}
  .ribbon{font-size:11px;color:#1a1a1a;background:var(--warn);padding:3px 8px;border-radius:6px;display:inline-block;margin-top:6px;font-weight:600}
  .ribbon.danger{background:var(--bad);color:#fff}
  .attempts{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .attempts span{font-size:10px;background:var(--chip);padding:2px 8px;border-radius:8px;color:var(--dim)}
  .attempts span.fail{color:var(--bad)} .attempts span.win{color:var(--ok)}
  .empty{text-align:center;color:var(--dim);font-size:12px;padding:24px 0}
  #toasts{position:fixed;bottom:20px;right:20px;z-index:99}
  .toast{background:#421520;border:1px solid var(--bad);color:#ffd7dc;padding:12px 16px;border-radius:10px;margin-top:10px;font-size:13px;max-width:360px;animation:slide .25s ease}
  .toast.info{background:#12304f;border-color:var(--accent);color:#cfe4ff}
  @keyframes slide{from{transform:translateX(30px);opacity:0}}
  .mono{font-family:Consolas,monospace;font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>BAMAS Middleware<span>budget-aware proxy · :8001</span></h1>
  <div class="pill" id="health">connecting…</div>
</header>

<main>
  <section>
    <div class="card">
      <h2>💰 Wallets</h2>
      <label>Name</label><input id="w_name" placeholder="Project wallet">
      <label>Max spend (USD)</label><input id="w_max" type="number" step="0.0001" value="0.0005">
      <button onclick="createWallet()">Create budget</button>
      <div id="wallets" style="margin-top:14px"></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h2>🤖 Agents</h2>
      <div id="agents"><div class="empty">loading…</div></div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>⚡ New Task</h2>
      <label>Task prompt</label>
      <textarea id="t_prompt" placeholder='e.g. "Write a CSV parser"'></textarea>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px">
        <div><label>Wallet</label><select id="t_wallet"></select></div>
        <div><label>Ceiling $</label><input id="t_budget" type="number" step="0.01" value="0.01"></div>
      </div>
      <button id="t_btn" onclick="createTask()">Route cheapest agent ▶</button>
    </div>

    <div class="card" style="margin-top:18px">
      <h2>📋 Task Feed</h2>
      <div id="tasks"><div class="empty">no tasks yet</div></div>
    </div>
  </section>
</main>

<div id="toasts"></div>

<script>
const API = location.origin;
let selectedWallet = null;

async function jfetch(url, opts){
  const r = await fetch(url, opts);
  const body = await r.json().catch(()=>({}));
  if(!r.ok) throw {status:r.status, body};
  return body;
}

function toast(msg, cls='info'){
  const d=document.createElement('div');
  d.className='toast '+cls; d.textContent=msg;
  document.getElementById('toasts').appendChild(d);
  setTimeout(()=>d.remove(),4200);
}

function esc(s){const x=document.createElement('i');x.textContent=s??'';return x.innerHTML}

// ── Health ──
async function pollHealth(){
  const el=document.getElementById('health');
  try{ await jfetch(API+'/health'); el.textContent='● LIVE'; el.className='pill ok'; }
  catch{ el.textContent='● DOWN'; el.className='pill bad'; }
}

// ── Agents ──
async function pollAgents(){
  try{
    const data = await jfetch(API+'/api/v1/agents');
    document.getElementById('agents').innerHTML =
      data.agents.map(a=>`
        <div class="agent">
          <div class="dot ${a.healthy?'ok':'bad'}"></div>
          <div>
            <b>${esc(a.agent_id)}</b> <span class="tag ${a.enabled?'active':''}">${a.enabled?'enabled':'disabled'}</span>
            <div class="meta">reliability ${(a.reliability*100).toFixed(0)}% · avg ${Math.round(a.avg_latency_ms)}ms · tasks ${a.total_tasks}</div>
          </div>
        </div>`).join('');
  }catch{}
}

// ── Wallets ──
async function pollWallets(){
  try{
    const list = await jfetch(API+'/api/v1/budgets');
    if(!list.length){document.getElementById('wallets').innerHTML='<div class="empty">no wallets yet</div>';}
    else{
      document.getElementById('wallets').innerHTML = list.map(w=>{
        const pct = Math.min(100,(w.spent_usd/w.max_cost_usd)*100);
        const cls = pct>=100?'full':(pct>=80?'warn':'');
        return `
        <div class="wallet ${selectedWallet===w.budget_id?'sel':''}" onclick="pickWallet('${w.budget_id}')">
          <div class="row"><b>${esc(w.name||w.budget_id)}</b><span class="tag ${w.status==='exhausted'?'exhausted':'active'}">${w.status}</span></div>
          <div class="row mono">$${w.spent_usd.toFixed(6)} / $${w.max_cost_usd.toFixed(6)}</div>
          <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
        </div>`;
      }).join('');
    }
    const sel=document.getElementById('t_wallet');
    sel.innerHTML='<option value="">— ephemeral per task —</option>'+list.map(w=>
      `<option value="${w.budget_id}" ${selectedWallet===w.budget_id?'selected':''}>${esc(w.name)} ($${w.remaining_usd.toFixed(6)} left)</option>`).join('');
  }catch{}
}

function pickWallet(id){
  selectedWallet = selectedWallet===id ? null : id;
  pollWallets();
}

// ── Tasks ──
async function pollTasks(){
  try{
    const list = await jfetch(API+'/api/v1/tasks');
    if(!list.length){document.getElementById('tasks').innerHTML='<div class="empty">no tasks yet</div>';return;}
    document.getElementById('tasks').innerHTML = list.map(t=>{
      const att=(t.attempts||[]).map(a=>`<span class="${a.success?'win':'fail'}">${esc(a.agent)} ${a.success?'✓':'✗'}${a.cost_usd!=null?' $'+Number(a.cost_usd).toFixed(6):''}</span>`).join('');
      return `
      <div class="task ${t.status}">
        <div class="trow">
          <span class="status ${t.status}">${t.status}</span>
          <span class="mono">${esc(t.task_id)}</span>
          ${t.selected_agent?`<span class="tag">${esc(t.selected_agent)}</span>`:''}
          ${t.cost_usd!=null?`<span class="cost">$${Number(t.cost_usd).toFixed(6)}</span>`:''}
        </div>
        <div class="prompt-txt">${esc((t.output&&t.status==='completed')?String(t.output).slice(0,140):t.error||'')}</div>
        <div class="sub">est $${(t.estimated_cost_usd??0).toFixed(6)}${t.budget_spent_usd!=null?` · wallet spent $${t.budget_spent_usd.toFixed(6)}`:''}${t.latency_ms!=null?` · ${t.latency_ms}ms`:''}</div>
        ${t.warning?`<span class="ribbon">⚠ ${esc(t.warning)}</span>`:''}
        ${t.budget_exceeded?`<span class="ribbon danger">BUDGET EXCEEDED</span>`:''}
        ${att?`<div class="attempts">${att}</div>`:''}
      </div>`;
    }).join('');
  }catch{}
}

// ── Actions ──
async function createWallet(){
  const name=document.getElementById('w_name').value||'Wallet';
  const max=parseFloat(document.getElementById('w_max').value);
  try{
    const w=await jfetch(API+'/api/v1/budgets',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,owner:'dashboard',max_cost_usd:max})});
    toast(`Wallet ${w.budget_id} created ($${max})`);
    selectedWallet=w.budget_id; pollWallets();
  }catch(e){ toast(`Failed: ${e.body?.detail||e.status}`,'err'); }
}

async function createTask(){
  const btn=document.getElementById('t_btn'); btn.disabled=true;
  const payload={
    prompt:document.getElementById('t_prompt').value,
    budget_usd:parseFloat(document.getElementById('t_budget').value)||0.01,
    budget_id:selectedWallet||undefined,
  };
  if(!payload.prompt){ toast('Prompt required','err'); btn.disabled=false; return; }
  try{
    const t=await jfetch(API+'/api/v1/tasks/',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    toast(`Queued on ${t.selected_agent} · est $${t.estimated_cost_usd}`);
    document.getElementById('t_prompt').value='';
  }catch(e){
    if(e.status===402) toast('💰 402 — BUDGET DENIED: '+(e.body?.detail||''),'err');
    else toast(`Error ${e.status}: ${JSON.stringify(e.body?.detail??e.body).slice(0,120)}`,'err');
  }finally{ btn.disabled=false; pollTasks(); pollWallets(); }
}

pollHealth();pollAgents();pollWallets();pollTasks();
setInterval(pollHealth,3000); setInterval(pollAgents,4000);
setInterval(pollWallets,1500); setInterval(pollTasks,1500);
</script>
</body>
</html>
