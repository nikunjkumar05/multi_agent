[project]
name = "bamas"
version = "0.2.0"
description = "Budget-aware multi-agent task executor with BAMAS-adapted cost-tier optimizer"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.scripts]
bamas-cli = "cli.bamas_cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["langchain_*", "langgraph.*", "langsmith.*", "redis.*", "aiosqlite.*", "orjson.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--ignore=tests/stress_test.py"
asyncio_mode = "auto"
