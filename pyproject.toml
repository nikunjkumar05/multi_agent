[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bamas"
version = "0.2.0"
description = "Budget-aware multi-agent task executor with BAMAS-adapted cost-tier optimizer"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "redis>=5.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "orjson>=3.9.0",
    "pyjwt>=2.7.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
bamas-cli = "cli.bamas_cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["langchain_*", "langgraph.*", "langsmith.*", "redis.*", "aiosqlite.*", "asyncpg.*", "orjson.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--ignore=tests/stress_test.py"
asyncio_mode = "auto"
