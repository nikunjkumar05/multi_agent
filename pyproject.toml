[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agent", "api", "middleware"]

[project]
name = "bamas"
version = "0.2.0"
description = "Budget-aware multi-agent task executor with BAMAS-adapted cost-tier optimizer"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "redis>=4.6.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "celery[redis]>=5.4.0",
    "orjson>=3.9.0",
    "pyjwt>=2.7.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",
    # Keep `class X(str, Enum)` pattern: StrEnum migration risks log/repr churn
    # across FastAPI serialization and audit formatting. Revisit deliberately.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Logging is configured before router/tool imports so early import-time logs
# inherit the root configuration — deliberate module-level ordering.
"api/main.py" = ["E402"]
"agent/tools/registry.py" = ["E402"]
"agent/nodes/validator.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["langchain_*", "langgraph.*", "langsmith.*", "redis.*", "aiosqlite.*", "asyncpg.*", "psycopg.*", "psycopg_pool.*", "celery.*", "orjson.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--ignore=tests/stress_test.py"
asyncio_mode = "auto"
